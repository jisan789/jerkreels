<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>403 Forbidden</title>
  <meta name="description" content="Access Restricted">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Telegram Web App Official SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Access Restriction Gate (Generic sterile 403, no bot usernames or links leaked) -->
  <div class="telegram-gate" id="telegramGate">
    <div class="gate-card">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </div>
      <h2>403 Forbidden</h2>
      <p>Access denied. You do not have permission to access this resource.</p>
    </div>
  </div>

  <div class="player-app" id="playerApp" style="display: none;">
    <!-- Main Player Stage (Fixed, Finger Swipe Enabled) -->
    <div class="player-stage" id="playerStage">
      <!-- Dual-Slot Smooth Reel Carousel Viewport -->
      <div class="video-carousel" id="videoCarousel">
        <div class="video-slot active-slot" id="slotA">
          <video id="videoA" class="reel-video" loop playsinline></video>
        </div>
        <div class="video-slot next-slot" id="slotB">
          <video id="videoB" class="reel-video" loop playsinline></video>
        </div>
      </div>

      <!-- Center Play/Pause Pop Indicator -->
      <div class="center-indicator" id="centerIndicator">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>

      <!-- Heart Burst (Double Tap Love) -->
      <div class="heart-burst" id="heartBurst">
        <svg viewBox="0 0 24 24" width="76" height="76" fill="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>

      <!-- Video Buffering Spinner -->
      <div class="stage-spinner" id="stageSpinner"></div>

      <!-- Minimalist Top Bar -->
      <header class="stage-header">
        <span class="stage-logo">ReelStream</span>

        <div class="header-right">
          <!-- Audio Toggle -->
          <button class="header-btn" id="btnAudioToggle" title="Audio (M)">
            <svg id="audioIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Right Action Sidebar (Love & Comment only) -->
      <aside class="action-sidebar">
        <!-- Love React -->
        <div class="action-wrap">
          <button class="circle-btn" id="btnLove" title="Love React">
            <svg id="loveIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <span class="action-num" id="loveCount">0</span>
        </div>

        <!-- Send Video to Bot Inbox -->
        <div class="action-wrap">
          <button class="circle-btn" id="btnSendInbox" title="Send video to my inbox">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
          <span class="action-num">Inbox</span>
        </div>
      </aside>

      <!-- Scrubber Progress Bar -->
      <div class="stage-scrubber" id="scrubberBar">
        <div class="scrubber-track">
          <div class="scrubber-fill" id="scrubberFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Popup -->
  <div class="toast-popup" id="toastPopup"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
