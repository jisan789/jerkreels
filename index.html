<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReelStream</title>
  <meta name="description" content="Telegram Mini App for watching reels.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Telegram Web App Official SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Direct Access Lock Gate (Visible by default until Telegram WebApp verified) -->
  <div class="telegram-gate" id="telegramGate">
    <div class="gate-card">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Access Restricted</h2>
      <p>This web application is protected and can only be accessed as a Telegram Mini App inside <strong>@jerkmatereelsBot</strong>.</p>
      <a href="https://t.me/jerkmatereelsBot" target="_blank" class="gate-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
        </svg>
        Open in Telegram Bot
      </a>
    </div>
  </div>

  <div class="player-app" id="playerApp" style="display: none;">
    <!-- Main Player Stage (Fixed, Finger Swipe Enabled) -->
    <div class="player-stage" id="playerStage">
      <!-- Active Video Element -->
      <video id="activeVideo" class="video-element" loop playsinline></video>
      
      <!-- Preload Hidden Video Element (Next Random Reel Buffering) -->
      <video id="preloadVideo" class="video-preload" preload="auto" muted playsinline></video>

      <!-- Center Play/Pause Pop Indicator -->
      <div class="center-indicator" id="centerIndicator">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>

      <!-- Heart Burst (Double Tap / Partner Love) -->
      <div class="heart-burst" id="heartBurst">
        <svg viewBox="0 0 24 24" width="76" height="76" fill="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>

      <!-- Video Buffering Spinner -->
      <div class="stage-spinner" id="stageSpinner"></div>

      <!-- Minimalist Top Bar -->
      <header class="stage-header">
        <span class="stage-logo">ReelStream</span>

        <div class="header-right">
          <!-- Watch Together Single Unified Toggle -->
          <button class="mode-toggle-btn" id="btnModeToggle" title="Toggle Single View / Watch Together">
            <span class="status-dot" id="statusDot"></span>
            <span id="modeLabel">Watch Together</span>
          </button>

          <!-- Audio Toggle -->
          <button class="header-btn" id="btnAudioToggle" title="Audio (M)">
            <svg id="audioIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Floating Incoming Message Popup (Shows actual message text) -->
      <div class="msg-popup" id="msgPopup">
        <div class="msg-popup-avatar">💬</div>
        <div class="msg-popup-content">
          <div class="msg-popup-sender" id="msgPopupSender">Partner</div>
          <div class="msg-popup-text" id="msgPopupText"></div>
        </div>
      </div>

      <!-- Right Action Sidebar (Love & Comment only) -->
      <aside class="action-sidebar">
        <!-- Love React -->
        <div class="action-wrap">
          <button class="circle-btn" id="btnLove" title="Love React">
            <svg id="loveIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <span class="action-num" id="loveCount">0</span>
        </div>

        <!-- Comments -->
        <div class="action-wrap">
          <button class="circle-btn" id="btnComment" title="Comments">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </button>
          <span class="action-num" id="commentsCount">0</span>
        </div>
      </aside>

      <!-- Scrubber Progress Bar -->
      <div class="stage-scrubber" id="scrubberBar">
        <div class="scrubber-track">
          <div class="scrubber-fill" id="scrubberFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Comments Drawer (Live Synced in Watch Together) -->
  <div class="comments-overlay" id="commentsOverlay">
    <div class="comments-panel">
      <div class="comments-header">
        <div class="panel-grabber"></div>
        <div class="comments-title-row">
          <h4 id="commentsTitle">Comments</h4>
          <button class="comments-close" id="btnCloseComments">&times;</button>
        </div>
        <p class="comments-subtitle" id="commentsSubtitle">Live comments between viewers</p>
      </div>
      <div class="comments-body" id="commentsList">
        <!-- Live comments populated here -->
      </div>
      <form class="comments-composer" id="commentsForm">
        <input type="text" id="commentInput" placeholder="Add a comment..." autocomplete="off">
        <button type="submit" class="comment-submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Popup -->
  <div class="toast-popup" id="toastPopup"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
